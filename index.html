<header><div><h1>惠更斯波動實驗室</h1><p>高一物理・看見波前如何傳播與改變</p></div><p>可暫停、調整參數，再慢慢講解</p></header>
<div class="tabs" role="tablist" aria-label="波動現象"><button role="tab" data-mode="plane">平面波</button><button role="tab" data-mode="circle">圓形波</button><button role="tab" data-mode="refraction">折射與 Snell 定律</button><button role="tab" data-mode="reflection">反射</button><button role="tab" data-mode="interference">雙波源干涉</button><button role="tab" data-mode="diffraction">單縫繞射</button><button role="tab" data-mode="sound">聲音干涉與偵測器</button><button role="tab" data-mode="laser">雷射雙縫干涉</button></div>

<aside class="controls"><h2>調整與觀察</h2><div class="row"><label for="lambda"><span>介質 1 的波長 λ₁</span><output id="lambdaOut"></output></label><input id="lambda" type="range" min="45" max="120" step="5" value="80"></div>
<div class="row" id="angleRow"><label for="angle"><span>入射角 θ₁</span><output id="angleOut"></output></label><input id="angle" type="range" min="0" max="50" step="1" value="35"></div>
<div class="row" id="speedRow"><label for="speed"><span>波速比 v₂ / v₁</span><output id="speedOut"></output></label><input id="speed" type="range" min="0.25" max="2.5" step="0.05" value="0.7"></div>
<div class="row" id="gapRow"><label for="gap"><span id="gapLabel">波源距離</span><output id="gapOut"></output></label><input id="gap" type="range" min="1" max="1200" step="0.001" value="140"></div>
<div class="row hidden" id="diffractionPresets"><div class="actions"><button id="slitNarrow">縫寬 ≪ 波長</button><button id="slitEqual">縫寬 ≈ 波長</button><button id="slitWide">縫寬 ≫ 波長</button></div></div><div class="row hidden" id="sourceRow"><label for="sourceView">波源顯示</label><select id="sourceView"><option value="both">兩個波源</option><option value="a">只看波源 A</option><option value="b">只看波源 B</option></select></div><div class="hidden" id="laserControls"><div class="row"><label for="laserColor">雷射顏色</label><select id="laserColor"><option value="red">紅光 650 nm</option><option value="green">綠光 532 nm</option><option value="custom">自訂波長</option></select></div><div class="row"><label for="laserLambda">光的波長 <output id="laserLambdaOut"></output></label><input id="laserLambda" type="range" min="400" max="700" value="650" step="1"></div><div class="row"><label for="slitDistance">雙縫間距 d <output id="slitDistanceOut"></output></label><input id="slitDistance" type="range" min="0.1" max="0.8" step="0.05" value="0.35"></div><div class="row"><label for="screenDistance">屏幕距離 D <output id="screenDistanceOut"></output></label><input id="screenDistance" type="range" min="0.5" max="3" step="0.1" value="1.5"></div><label class="check"><input id="laserCompare" type="checkbox" checked>同時顯示紅光與綠光</label><div id="laserMixControls"><div class="row"><label for="laserSeparation">紅綠條紋分開程度 <output id="laserSeparationOut"></output></label><input id="laserSeparation" type="range" min="0" max="100" step="1" value="100"></div><div class="row"><label for="laserShift">綠光條紋上下位移 <output id="laserShiftOut"></output></label><input id="laserShift" type="range" min="-4" max="4" step="0.1" value="0"></div></div><div class="row"><label for="laserProbe">檢視屏幕位置 y <output id="laserProbeOut"></output></label><input id="laserProbe" type="range" min="-10" max="10" step="0.1" value="0"></div></div><div class="hidden" id="soundControls"><div class="row"><label for="soundFrequency">兩波源共同頻率 <output id="soundFrequencyOut"></output></label><input id="soundFrequency" type="range" min="100" max="1000" step="10" value="440"></div><button id="soundToggle">播放偵測器聲音</button><p class="small" id="soundStatus">拖曳麥克風；也可聚焦圖面後用方向鍵移動。動畫以慢動作呈現。</p></div><div class="row" id="pointsRow"><label for="points">次級點波源數量 <output id="pointsOut"></output></label><input id="points" type="range" min="1" max="25" value="13" step="1"></div><label class="check" id="envelopeRow"><input id="envelope" type="checkbox" checked><span id="envelopeLabel">顯示連續波前的理想包絡</span></label><label class="check" id="waveletRow"><input id="wavelets" type="checkbox" checked>顯示擴大的子波</label><label class="check" id="geometryRow"><input id="geometry" type="checkbox" checked>顯示角度與法線</label>
<div class="actions"><button id="play">暫停</button><button id="step">前進一小步</button><button id="reset">重設</button></div><div class="formula" id="formula"></div><div class="small">距離採畫面比例單位；本頁是二維教學模型。波長越大，固定介質波速時頻率越低。波前以清楚線條顯示；可分別觀察兩個波源。</div></aside></div>
</main><script>

function params(){return {L:+ui.lambda.value,a:+ui.angle.value*PI/180,r:+ui.speed.value,g:+ui.gap.value,count:+ui.points.value}}
function line(x1,y1,x2,y2,color='#fff',width=2,dash=[]){ctx.beginPath();ctx.setLineDash(dash);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([])}
function text(s,x,y,color='#eef7ff',size=22){ctx.fillStyle=color;ctx.font=`600 ${size}px system-ui, Microsoft JhengHei`;ctx.fillText(s,x,y)}
function arrow(x,y,dx,dy,color='#f5f9ff',label=''){const n=Math.hypot(dx,dy),ux=dx/n,uy=dy/n;line(x,y,x+dx,y+dy,color,3);ctx.beginPath();ctx.moveTo(x+dx,y+dy);ctx.lineTo(x+dx-ux*13-uy*6,y+dy-uy*13+ux*6);ctx.lineTo(x+dx-ux*13+uy*6,y+dy-uy*13-ux*6);ctx.closePath();ctx.fillStyle=color;ctx.fill();if(label)text(label,x+dx+8,y+dy,color,19)}
function wavelengthMark(nx,ny,L,phase,x,y,originY,label){const q=Math.round((nx*x+ny*(y-originY)-phase)/L)*L+phase,delta=q-(nx*x+ny*(y-originY));x+=delta*nx;y+=delta*ny;arrow(x,y,nx*L,ny*L,'#ffd072');arrow(x+nx*L,y+ny*L,-nx*L,-ny*L,'#ffd072');text(label,x+nx*L*.5+8,y+ny*L*.5-8,'#ffd072',20)}
function circle(x,y,r,color='#ffd072',width=1.5){ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,2*PI);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function angleArc(start,end,color){ctx.beginPath();ctx.arc(690,280,55,start,end);ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.stroke()}
function fronts(nx,ny,L,phase,color,dashed=false){const diag=1500;for(let j=-40;j<=40;j++){const q=j*L+phase;const x=nx*q,y=ny*q;line(x-ny*diag,y+nx*diag,x+ny*diag,y-nx*diag,color,2,dashed?[8,8]:[])}}
function clipping(x,y,w,h,fn){ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();fn();ctx.restore()}
function frontPair(nx,ny,L,phase){fronts(nx,ny,L,phase,'#55d8f0');fronts(nx,ny,L,phase+L/2,'#ff85b5',true)}
// Each cohort is emitted once per period. All radii grow at the local wave speed.
function cohorts(period,maxAge,fn){const last=Math.floor(t/period);for(let j=Math.max(0,last-Math.ceil(maxAge/period));j<=last;j++){let age=t-j*period;if(age>=0&&age<=maxAge)fn(age,j)}}
function dot(x,y,color='#ffd072',r=4){ctx.beginPath();ctx.arc(x,y,r,0,2*PI);ctx.fillStyle=color;ctx.fill()}
function arc(x,y,r,a,b,color,width=1.6){if(r<.01)return;ctx.beginPath();ctx.arc(x,y,r,a,b);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function drawPlane(p){
 const sx=170,period=p.L/50;
 line(sx,45,sx,515,'#70869c',1,[4,6]);
 if(ui.wavelets.checked)cohorts(period,17,age=>{let r=50*age;for(const y of pointPositions(p.count,70,490))arc(sx,y,r,-PI/2,PI/2,'#ffd07299');});
 cohorts(period,17,age=>{let x=sx+50*age;if(x<W){if(ui.envelope.checked)line(x,70,x,490,'#52d5f0',3);if(ui.envelope.checked&&ui.wavelets.checked)for(const y of pointPositions(p.count,70,490))dot(x,y,'#c7f6ff',2);}});
 for(const y of pointPositions(p.count,70,490))dot(sx,y);
 text('波前上的次級點波源',30,32,'#ffd072',21);
 text('擴大的子波 → 共同切線（新波前）',420,32,'#52d5f0',21);
 arrow(70,535,100,0,'#eef7ff','傳播方向');
 if(ui.envelope.checked)cohorts(period,17,(age,j)=>{if(age>=period)travellingPair(sx+50*(age-period),450,p.L,0,'λ')});
}
function drawCircle(p){
 const cx=345,cy=280,R=95,period=p.L/50;
 circle(cx,cy,R,'#70869c',1);
 if(ui.wavelets.checked)cohorts(period,14,age=>{let r=50*age;for(let j=0;j<p.count;j++){let a=j*2*PI/p.count;arc(cx+R*Math.cos(a),cy+R*Math.sin(a),r,a-PI/2,a+PI/2,'#ffd07299');}});
 cohorts(period,14,age=>{const r=R+50*age;if(ui.envelope.checked)circle(cx,cy,r,'#52d5f0',3);if(ui.envelope.checked&&ui.wavelets.checked)for(let j=0;j<p.count;j++){let a=j*2*PI/p.count;dot(cx+r*Math.cos(a),cy+r*Math.sin(a),'#c7f6ff',2);}});
 for(let j=0;j<p.count;j++){let a=j*2*PI/p.count;dot(cx+R*Math.cos(a),cy+R*Math.sin(a));}
 dot(cx,cy,'#fff',5);text('原點波源',cx-44,cy+30,'#eef7ff',18);
 text('原圓形波前上的點 → 擴大的子波 → 圓形包絡',25,32,'#52d5f0',21);
 if(ui.envelope.checked)cohorts(period,14,(age,j)=>{if(age>=period)travellingPair(cx+R+50*(age-period),cy,p.L,0,'λ')});
}
function segment(nx,ny,q,ox,oy,region,sourceBounds=false){
 const bx=ox+nx*q,by=oy+ny*q,tx=-ny,ty=nx;let lo=-2000,hi=2000;
 function bound(base,d,min,max){if(Math.abs(d)<1e-9)return base>=min&&base<=max;let a=(min-base)/d,b=(max-base)/d;lo=Math.max(lo,Math.min(a,b));hi=Math.min(hi,Math.max(a,b));return lo<=hi}
 if(!bound(bx,tx,region[0],region[2])||!bound(by,ty,region[1],region[3]))return null;
 if(sourceBounds&&Math.abs(ny)>1e-7&&!bound(bx-nx*(by-oy)/ny,tx-nx*ty/ny,10,990))return null;

}
function paintSegment(s,color,width=2){if(s)line(s.bx+s.tx*s.lo,s.by+s.ty*s.lo,s.bx+s.tx*s.hi,s.by+s.ty*s.hi,color,width)}
function travellingPair(x,y,dx,dy,label){if(Math.min(x,x+dx)<15||Math.min(y,y+dy)<15||Math.max(x,x+dx)>985||Math.max(y,y+dy)>545)return false;arrow(x,y,dx,dy,'#ffd072');arrow(x+dx,y+dy,-dx,-dy,'#ffd072');text(label,x+dx/2+8,y+dy/2-8,'#ffd072',20);return true}
function pointPositions(count,min,max){return count===1?[(min+max)/2]:Array.from({length:count},(_,j)=>min+(max-min)*j/(count-1))}
function markExisting(fronts,L,label){
 const sorted=fronts.filter(Boolean).sort((a,b)=>a.q-b.q);
 for(let i=0;i<sorted.length-1;i++){
 const a=sorted[i],b=sorted[i+1];if(Math.abs(b.q-a.q-L)>1e-6)continue;

 }
}
function interfaceDraw(p,reflectMode){

 const a2=isReflect?p.a:Math.asin(Math.min(1,sin2)),nx=isReflect?st:Math.sin(a2),ny=isReflect?-ct:Math.cos(a2),v=50*(isReflect?1:p.r),period=p.L/50;
 ctx.fillStyle='#10253a';ctx.fillRect(0,0,W,Y);ctx.fillStyle=reflectMode?'#263645':'#163c4a';ctx.fillRect(0,Y,W,H-Y);

  let f=segment(st,ct,50*(t-j*period),A,Y,[0,0,1000,280]);if(f)f.id=j;incoming.push(f);paintSegment(f,'#52d5f0');
 }
 if(ui.wavelets.checked&&!critical)clipping(0,isReflect?0:Y,W,isReflect?Y:H-Y,()=>{
  for(const x of pointPositions(p.count,10,970)){let delay=(x-A)*st/50,last=Math.floor((t-delay)/period);for(let j=Math.max(0,last-12);j<=last;j++){let age=t-j*period-delay;if(age>=0&&age<24)arc(x,Y,v*age,isReflect?PI:0,isReflect?2*PI:PI,'#ffd07288',1.5)}}
 });
 if(!critical)for(let j=Math.max(0,Math.floor(t/period)-24);j<=Math.floor(t/period)+8;j++){
  const f=segment(nx,ny,v*(t-j*period),A,Y,isReflect?[0,0,1000,280]:[0,280,1000,560],true);if(f)f.id=j;outgoing.push(f);if(ui.envelope.checked)paintSegment(f,isReflect?'#ff8bb7':'#52d5f0',3);
 }
 line(0,Y,W,Y,'#e6f3fa',2);
 for(const x of pointPositions(p.count,10,970))dot(x,Y,t>=(x-A)*st/50?'#ffd072':'#70869c',3.5);
 text('介質 1',16,25);text(reflectMode?'反射面':'介質 2',16,315);
 text(tir?'超過臨界角：全反射，無傳播的折射波前':critical?'臨界角：折射方向沿介面':'介面各點被波碰到後，才開始發出子波',18,535,'#ffd072',20);
 if(ui.geometry.checked){const ox=690,oy=Y;line(ox,55,ox,505,'#e8f4fb99',2,[7,7]);text('法線',ox+8,70,'#eef7ff',18);arrow(ox-st*155,oy-ct*155,st*140,ct*140);arrow(ox,oy,nx*150,ny*150,'#ffd072');text('θ₁ '+Math.round(p.a*180/PI)+'°',ox-130,oy-70,'#fff',19);text(isReflect?'θᵣ '+Math.round(p.a*180/PI)+'°':'θ₂ '+(a2*180/PI).toFixed(1)+'°',ox+28,isReflect?oy-70:oy+85,'#ffd072',19);if(p.a>.01){angleArc(-PI/2-p.a,-PI/2,'#fff');angleArc(isReflect?-PI/2:PI/2-a2,isReflect?-PI/2+p.a:PI/2,'#ffd072')}}

}
function drawInterference(p){
 const period=p.L/50,view=ui.sourceView.value,sources=[{x:270,y:280-p.g/2,color:'#52d5f0',id:'a',name:'A'},{x:270,y:280+p.g/2,color:'#ff8bb7',id:'b',name:'B'}];
