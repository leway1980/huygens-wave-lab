.small a{color:#8ee2f4}.row output{white-space:nowrap}</style></head><body><main>
<header><div><h1>惠更斯波動實驗室</h1><p>高一物理・看見波前如何傳播與改變</p></div><p>可暫停、調整參數，再慢慢講解</p></header>
<div class="toolbar"><label for="modeSelect">情境</label><select id="modeSelect" aria-label="波動現象"><option value="plane">平面波</option><option value="circle">圓形波</option><option value="refraction">折射與司乃耳定律</option><option value="reflection">反射</option><option value="interference">雙波源干涉</option><option value="diffraction">教材繞射：狹縫、障礙物、邊緣</option><option value="sound">聲音干涉與偵測器</option><option value="laser">雷射雙縫干涉</option><optgroup label="生活中的波動與干涉"><option value="spider">蜘蛛絲彩光</option><option value="cd">光碟片</option><option value="newton">牛頓環</option><option value="moire">摩爾紋（幾何疊圖）</option><option value="oil">地面油膜</option><option value="bubble">肥皂泡</option><option value="doppler">杜普勒效應</option></optgroup></select><button id="play">暫停</button><button id="step">單步</button><button id="derive" class="hidden">三角形推導 ↗</button></div>
<div class="layout"><section class="stage"><canvas tabindex="0" style="touch-action:none" id="wave" width="1000" height="560" aria-label="波動示意圖"></canvas><div id="newtonStructure" class="hidden"><svg viewBox="0 0 1000 145" role="img" aria-label="凸透鏡與平玻璃之間的空氣膜，中央最薄，外側較厚"><path d="M70 25 H430 V65 Q250 155 70 65 Z" fill="#447da955" stroke="#b5eaff" stroke-width="2"/><path d="M60 110 H440 V135 H60 Z" fill="#447da955" stroke="#b5eaff" stroke-width="2"/><line x1="365" y1="91" x2="365" y2="110" stroke="#ffd072" stroke-width="3"/><text x="475" y="45" fill="#eef7ff" font-size="23">凸透鏡＋平玻璃：中央接觸，向外空氣膜越厚</text><text x="475" y="83" fill="#ffd072" font-size="23">d(r) ≈ d₀ + r² / (2R) → 相同厚度形成圓環</text><text x="475" y="120" fill="#aebfd1" font-size="19">剖面與膜厚均為放大示意</text></svg></div><div class="legend" id="lineLegend"><span class="cyan">━━ 子波的包絡（波峰波前）</span><span class="gold">● 波前上的點波源</span><span class="gold">◠ 持續擴大的子波</span></div><div class="legend hidden" id="fieldLegend"><span class="cyan">━━ 波源 A／縫內點 1</span><span class="pink">━━ 波源 B／縫內點 2</span><span class="gold">━━ 縫內點 3／等路徑線</span></div><div class="caption" id="caption"></div></section>
<aside class="controls"><h2>調整與觀察</h2><div class="row"><label for="lambda"><span>介質 1 的波長 λ₁</span><output id="lambdaOut"></output></label><input id="lambda" type="range" min="45" max="120" step="5" value="80"></div>
<div class="row" id="angleRow"><label for="angle"><span>入射角 θ₁</span><output id="angleOut"></output></label><input id="angle" type="range" min="0" max="50" step="1" value="35"></div>
<div class="row" id="speedRow"><label for="speed"><span>波速比 v₂ / v₁</span><output id="speedOut"></output></label><input id="speed" type="range" min="0.25" max="2.5" step="0.05" value="0.7"></div>
<div class="row" id="gapRow"><label for="gap"><span id="gapLabel">波源距離</span><output id="gapOut"></output></label><input id="gap" type="range" min="1" max="1200" step="0.001" value="140"></div>
<div class="row hidden" id="diffractionSceneRow"><label for="diffractionScene">繞射情境</label><select id="diffractionScene"><option value="slit">穿過狹縫</option><option value="obstacle">繞過障礙物</option><option value="edge">繞過單側邊緣</option></select></div><div class="row hidden" id="diffractionPresets"><div class="actions"><button id="slitNarrow">縫寬 ≪ 波長</button><button id="slitEqual">縫寬 ≈ 波長</button><button id="slitWide">縫寬 ≫ 波長</button></div></div><div class="hidden" id="waterControls"><div class="row"><label for="frequencyA">波源 A 頻率 <output id="frequencyAOut"></output></label><input id="frequencyA" type="range" min="0.4" max="1.2" step="0.025" value="0.625"></div><div class="row"><label for="frequencyB">波源 B 頻率 <output id="frequencyBOut"></output></label><input id="frequencyB" type="range" min="0.4" max="1.2" step="0.025" value="0.625"></div><div class="actions"><button id="waterEqual">恢復同頻</button><button id="waterHigher">B 頻率較高</button><button id="waterLower">B 頻率較低</button></div><label class="check"><input id="waterField" type="checkbox" checked>顯示疊加水面</label><label class="check"><input id="waterPhase" type="checkbox" checked>追蹤中央相長線</label><p class="small">固定波速 v = 50 單位／秒。頻率改變時，從同相起點重新比較。</p></div><div class="row hidden" id="sourceRow"><label for="sourceView">波源顯示</label><select id="sourceView"><option value="both">兩個波源</option><option value="a">只看波源 A</option><option value="b">只看波源 B</option></select></div><div class="hidden" id="laserControls"><div class="row"><label for="laserColor">雷射顏色</label><select id="laserColor"><option value="red">紅光 650 nm</option><option value="green">綠光 532 nm</option><option value="custom">自訂波長</option></select></div><div class="row"><label for="laserLambda">光的波長 <output id="laserLambdaOut"></output></label><input id="laserLambda" type="range" min="400" max="700" value="650" step="1"></div><div class="row"><label for="slitDistance">雙縫間距 d <output id="slitDistanceOut"></output></label><input id="slitDistance" type="range" min="0.1" max="0.8" step="0.05" value="0.35"></div><div class="row"><label for="screenDistance">屏幕距離 D <output id="screenDistanceOut"></output></label><input id="screenDistance" type="range" min="0.5" max="3" step="0.1" value="1.5"></div><label class="check"><input id="laserCompare" type="checkbox" checked>同時顯示紅光與綠光</label><div id="laserMixControls"><div class="row"><label for="laserSeparation">紅綠條紋分開程度 <output id="laserSeparationOut"></output></label><input id="laserSeparation" type="range" min="0" max="100" step="1" value="100"></div><div class="row"><label for="laserShift">綠光條紋上下位移 <output id="laserShiftOut"></output></label><input id="laserShift" type="range" min="-4" max="4" step="0.1" value="0"></div></div><div class="row"><label for="laserOverlay">條紋與強度疊合 <output id="laserOverlayOut"></output></label><input id="laserOverlay" type="range" min="0" max="100" value="0" step="1"></div><div class="actions"><button id="laserApart">分開看</button><button id="laserTogether">疊合看</button></div><div class="row"><label for="laserProbe">檢視屏幕位置 y <output id="laserProbeOut"></output></label><input id="laserProbe" type="range" min="-10" max="10" step="0.1" value="0"></div></div><div id="dailyControls" class="hidden"><div class="row" id="spiderModelRow"><label for="spiderModel">蜘蛛絲：選擇理想化機制</label><select id="spiderModel"><option value="droplets">規則微滴陣列的散射疊加</option><option value="film">絲內外兩路：局部平膜近似</option></select></div><div class="row" id="dailyLightRow"><label for="dailyLight">入射光</label><select id="dailyLight"><option value="white">白光（多波長示意）</option><option value="green">單色綠光 532 nm</option></select></div><div id="dailyFilmControls"><div class="row" id="filmThicknessRow"><label for="filmThickness">平均膜厚／中央間隙 <output id="filmThicknessOut"></output></label><input id="filmThickness" type="range" min="0" max="1500" step="5" value="450"></div><div class="row" id="filmSpreadRow"><label for="filmSpread">膜厚不均勻程度 <output id="filmSpreadOut"></output></label><input id="filmSpread" type="range" min="0" max="1200" step="10" value="500"></div></div><div class="row" id="dailyAngleRow"><label for="dailyAngle">入射角／觀察角 <output id="dailyAngleOut"></output></label><input id="dailyAngle" type="range" min="0" max="35" step="0.5" value="0"></div><div class="row" id="dailyProbeRow"><label for="dailyProbe">取樣位置 <output id="dailyProbeOut"></output></label><input id="dailyProbe" type="range" min="-100" max="100" step="1" value="0"></div><div class="row" id="lensRadiusRow"><label for="lensRadius">透鏡曲率半徑 R <output id="lensRadiusOut"></output></label><input id="lensRadius" type="range" min="0.3" max="3" step="0.1" value="1"></div><div class="row" id="gratingSpacingRow"><label for="gratingSpacing">軌道／微滴間距 d <output id="gratingSpacingOut"></output></label><input id="gratingSpacing" type="range" min="0.8" max="5" step="0.05" value="1.6"></div><div id="moireControls"><div class="row" id="moireRotationRow"><label for="moireRotation">兩圖樣夾角 <output id="moireRotationOut"></output></label><input id="moireRotation" type="range" min="0" max="15" step="0.1" value="3"></div><div class="row" id="moirePitchRow"><label for="moirePitch">第二組節距／第一組節距 <output id="moirePitchOut"></output></label><input id="moirePitch" type="range" min="0.95" max="1.05" step="0.001" value="1"></div></div><div id="dopplerControls"><div class="row" id="carSpeedRow"><label for="carSpeed">車速（向右） <output id="carSpeedOut"></output></label><input id="carSpeed" type="range" min="0" max="270" step="5" value="0"></div><div class="row" id="carFrequencyRow"><label for="carFrequency">車子發聲頻率 <output id="carFrequencyOut"></output></label><input id="carFrequency" type="range" min="150" max="700" step="10" value="440"></div><div class="row"><label for="observerSide">觀察者位置</label><select id="observerSide"><option value="front">車子前方</option><option value="back">車子後方</option></select></div><div class="actions"><button id="dopplerSound">播放觀察者聽到的聲音</button><button id="dopplerRestart">重新開始</button></div><p class="small">車子到畫面右側後重新出發。聲音需點按播放。</p></div><div class="small" id="dailySources"></div></div><div class="hidden" id="soundControls"><div class="row"><label for="soundFrequency">兩波源共同頻率 <output id="soundFrequencyOut"></output></label><input id="soundFrequency" type="range" min="100" max="1000" step="10" value="440"></div><button id="soundToggle">播放偵測器聲音</button><p class="small" id="soundStatus">拖曳麥克風；也可聚焦圖面後用方向鍵移動。動畫以慢動作呈現。</p></div><div class="row" id="pointsRow"><label for="points">次級點波源數量 <output id="pointsOut"></output></label><input id="points" type="range" min="1" max="25" value="13" step="1"></div><label class="check" id="envelopeRow"><input id="envelope" type="checkbox" checked><span id="envelopeLabel">顯示連續波前的理想包絡</span></label><label class="check" id="waveletRow"><input id="wavelets" type="checkbox" checked>顯示擴大的子波</label><label class="check" id="geometryRow"><input id="geometry" type="checkbox" checked>顯示角度與法線</label>
<button id="reset">重設參數</button><div class="formula" id="formula"></div><div class="small" id="modelNote">距離採畫面比例單位；本頁是二維教學模型。波長越大，固定介質波速時頻率越低。波前以清楚線條顯示；可分別觀察兩個波源。</div></aside></div>
</main><dialog id="derivation" aria-labelledby="deriveTitle"><div class="dialogHead"><h2 id="deriveTitle">從波前三角形推出司乃耳定律</h2><button id="closeDerivation" aria-label="關閉推導">返回模擬 ×</button></div><p id="deriveContext"></p><div class="deriveBody"><div id="deriveFigure"></div><div id="deriveEquations" aria-live="polite" aria-atomic="true"></div></div><nav class="deriveNav" id="deriveNav" aria-label="推導步驟"><button id="derivePrev">← 上一步</button><span id="deriveProgress"></span><button id="deriveNext">下一步 →</button></nav><p class="small" id="deriveNote"></p></dialog><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),c=$('wave'),ctx=c.getContext('2d'),W=1000,H=560,PI=Math.PI;
const modes=['plane','circle','refraction','reflection','interference','diffraction','sound','laser','spider','cd','newton','moire','oil','bubble','doppler'];let mode='plane',t=0,playing=true,last=0,field=null,fieldKey='',markTracks={};
const ui={lambda:$('lambda'),angle:$('angle'),speed:$('speed'),gap:$('gap'),wavelets:$('wavelets'),geometry:$('geometry'),sourceView:$('sourceView'),laserColor:$('laserColor'),laserLambda:$('laserLambda'),slitDistance:$('slitDistance'),screenDistance:$('screenDistance'),laserCompare:$('laserCompare'),laserSeparation:$('laserSeparation'),laserShift:$('laserShift'),laserOverlay:$('laserOverlay'),laserProbe:$('laserProbe'),soundFrequency:$('soundFrequency'),points:$('points'),envelope:$('envelope'),diffractionScene:$('diffractionScene'),frequencyA:$('frequencyA'),frequencyB:$('frequencyB'),waterField:$('waterField'),waterPhase:$('waterPhase'),filmThickness:$('filmThickness'),filmSpread:$('filmSpread'),dailyAngle:$('dailyAngle'),dailyProbe:$('dailyProbe'),lensRadius:$('lensRadius'),gratingSpacing:$('gratingSpacing'),moireRotation:$('moireRotation'),moirePitch:$('moirePitch'),carSpeed:$('carSpeed'),carFrequency:$('carFrequency'),spiderModel:$('spiderModel'),dailyLight:$('dailyLight'),observerSide:$('observerSide')};
const pointCounts={plane:13,circle:18,refraction:25,reflection:25,diffraction:3};
const captions={sound:'聲音干涉：A、B 同頻同相。拖曳偵測器，聽等振幅模型在相長處變大聲、相消處變小聲；動畫慢動作，聲音以實際頻率播放。',laser:'左：雙縫次級波 → 中：屏幕位置對應的強度曲線 → 右：同位置的亮暗條紋。紅綠各自干涉，重合處做色光強度相加；波前為放大示意，中右共用位置刻度。',plane:'平面波：黃色各點同時發出不斷擴大的子波；青色直線是所有子波向前的共同切線（包絡）。',circle:'圓形波：原波前上的每一點發出子波，向外的共同包絡仍為圓形；三維對應球面波。',refraction:'波進入不同介質：頻率不變，波速改變，波長也隨之改變。角度都從法線量起。',reflection:'反射時，波留在原介質中：入射角等於反射角，頻率與波長不變。',interference:'干涉：藍、粉兩組圓弧分別來自同頻同相的 A、B；可分開觀察，再用路徑差判斷相長與相消。',diffraction:'單縫：細弧是縫內取樣子波，亮青線是連續縫口疊加後的新波前。比較 a/λ：遠小於 1、接近 1、遠大於 1；繞射程度連續改變，沒有突然切換的臨界值。'};
function compactControls(){
 const aside=document.querySelector('.controls'),advanced=document.createElement('details');advanced.id='advanced';advanced.innerHTML='<summary>更多設定</summary>';
 aside.insertBefore(advanced,$('formula'));for(const id of ['pointsRow','envelopeRow','waveletRow','geometryRow','reset','modelNote'])advanced.append($(id));
 const optical=document.createElement('details');optical.id='laserAdvanced';optical.innerHTML='<summary>雷射進階設定</summary>';$('laserControls').append(optical);
 for(const id of ['laserColor','laserLambda','slitDistance','screenDistance','laserShift'])optical.append($(id).closest('.row'));
 document.querySelector('.controls h2').textContent='主要參數';
}
compactControls();
