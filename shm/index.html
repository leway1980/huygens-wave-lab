<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>簡諧運動｜圓周運動與投影</title><style>:root{--foreground:#17233b;--background:#fff;--border:#c4cfdb;--muted-foreground:#6c788d;--orange:#d66d22;--viz-series-1:#2269b5;--viz-series-2:#d5682b;font-family:system-ui,sans-serif}body{margin:0;background:#f6f8fb;color:var(--foreground)}main{max-width:1300px;margin:auto;padding:12px 18px}.title{margin:4px 0 7px;font-size:clamp(22px,3vw,34px)}.subtitle{margin:0 0 12px;color:#4b5b73}.btn{border:1px solid #c4cfdb;border-radius:8px;padding:9px 14px;background:white;color:#21304c;font:inherit;cursor:pointer}.btn-primary{background:#205fa8;color:white;border-color:#205fa8}.btn[aria-pressed="true"]{background:#d6e8fa;border-color:#397bbd;color:#123d73;font-weight:700}.form-range{accent-color:#205fa8}svg{max-height:none;max-width:1050px;margin:auto}footer{color:#58667a;font-size:14px}@media(max-width:600px){main{padding:10px}svg{max-height:none}.btn{padding:8px;font-size:14px}}
*{box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
main{height:100dvh;width:100%;max-width:1440px;margin:0 auto;padding:10px 16px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.title{flex:none;margin:0;font-size:clamp(20px,2.3vw,29px);line-height:1.2}
.subtitle{flex:none;margin:0;font-size:14px;line-height:1.35}
#shm-visual{padding:0!important;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.viz-controls{flex:none;position:sticky;top:0;z-index:10;background:#f6f8fb;margin:0!important;padding:3px 0 7px;gap:6px!important}
.btn{padding:7px 12px;font-size:16px;line-height:1.25}
#s-svg{display:block;flex:1;min-height:0;width:100%!important;height:100%!important;max-width:none;max-height:none;margin:0}
footer{flex:none;font-size:11px;line-height:1.3;color:#58667a}
@media(max-height:580px){main{padding:6px 12px;gap:3px}.subtitle{display:none}.title{font-size:20px}.btn{padding:5px 9px;font-size:14px}footer{font-size:10px}}
@media(max-width:700px){main{padding:8px}.subtitle{font-size:12px}.btn{padding:6px 8px;font-size:14px}.viz-controls label{font-size:13px}}
</style></head><body><main><h1 class="title">簡諧運動：圓周運動與投影</h1><p class="subtitle">從木衛的左右位置出發，對照圓周運動的投影與三角函數。</p><div id="shm-visual" style="padding:10px;color:var(--foreground)">
  <div class="viz-controls" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
    <button type="button" class="btn btn-primary" id="s-play">播放一週期</button>
    <button type="button" class="btn" id="s-reset">回到起點</button>
    <button type="button" class="btn" id="s-pos" aria-pressed="true">位置 x</button>
    <button type="button" class="btn" id="s-vel" aria-pressed="false">速度 vₓ</button>
    <button type="button" class="btn" id="s-acc" aria-pressed="false">加速度 aₓ</button>
    <label for="s-time">時間 <span id="s-value">0.00 T</span></label><input id="s-time" class="form-range" type="range" min="0" max="1000" value="0" style="width:150px" aria-label="選擇時間" />
  </div>
  <svg id="s-svg" role="img" aria-label="左側木衛觀察圖與三角函數公式，右側圓周運動與投影紀錄" viewBox="0 0 1040 680" style="display:block;width:100%;height:auto;font-family:system-ui,sans-serif"><defs><marker id="s-arr" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 Z" fill="var(--viz-series-1)"/></marker><marker id="s-arr2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 Z" fill="var(--viz-series-2)"/></marker><radialGradient id="jupiter"><stop stop-color="#e5cc9e"/><stop offset=".5" stop-color="#bd9361"/><stop offset="1" stop-color="#775538"/></radialGradient><radialGradient id="jovian-shade" cx="35%" cy="30%" r="70%"><stop stop-color="#fff0ce"/><stop offset=".65" stop-color="#dfbf8f"/><stop offset="1" stop-color="#8b694b"/></radialGradient><clipPath id="jovian-disc"><circle cx="50" cy="50" r="46"/></clipPath><symbol id="jupiter-cartoon" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="url(#jovian-shade)" stroke="#8f6c49" stroke-width="2"/><g clip-path="url(#jovian-disc)"><path d="M0 23 Q30 15 57 23 T100 21 L100 31 Q70 35 43 29 T0 32Z" fill="#be8f60"/><path d="M0 37 Q24 32 50 39 T100 37 L100 47 Q72 51 48 45 T0 47Z" fill="#a56c47"/><path d="M0 50 Q28 47 51 52 T100 51 L100 58 Q75 61 48 56 T0 59Z" fill="#f9e4ba"/><path d="M0 62 Q20 57 47 64 T100 62 L100 73 Q72 76 50 70 T0 72Z" fill="#b67f54"/><path d="M0 81 Q27 75 51 82 T100 80 L100 87 Q72 91 46 86 T0 89Z" fill="#c99c70"/><ellipse cx="67" cy="67" rx="14" ry="8" fill="#be6450" transform="rotate(-9 67 67)"/><ellipse cx="67" cy="66" rx="8" ry="4" fill="#db9472" transform="rotate(-9 67 66)"/><ellipse cx="30" cy="28" rx="12" ry="25" fill="#fff7dc" opacity=".16"/></g></symbol></defs><g fill="currentColor" font-size="22" font-weight="700" text-anchor="middle"><text x="260" y="29">木衛的左右位置</text><text x="730" y="24">俯視：木衛繞木星運動</text></g><foreignObject x="20" y="54" width="480" height="288"><div xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%"><div style="position:relative;width:100%;height:12.5%;overflow:hidden"><img src="https://phys.libretexts.org/@api/deki/files/3343/JupiterMoons.PNG?revision=1" referrerpolicy="no-referrer" alt="木衛位置觀察圖，時間由上至下" style="position:absolute;width:100%;height:800%;max-width:none;top:-700%;left:0"/></div><div style="position:relative;width:100%;height:12.5%;overflow:hidden"><img src="https://phys.libretexts.org/@api/deki/files/3343/JupiterMoons.PNG?revision=1" referrerpolicy="no-referrer" alt="" style="position:absolute;width:100%;height:800%;max-width:none;top:-600%;left:0"/></div><div style="position:relative;width:100%;height:12.5%;overflow:hidden"><img src="https://phys.libretexts.org/@api/deki/files/3343/JupiterMoons.PNG?revision=1" referrerpolicy="no-referrer" alt="" style="position:absolute;width:100%;height:800%;max-width:none;top:-500%;left:0"/></div><div style="position:relative;width:100%;height:12.5%;overflow:hidden"><img src="https://phys.libretexts.org/@api/deki/files/3343/JupiterMoons.PNG?revision=1" referrerpolicy="no-referrer" alt="" style="position:absolute;width:100%;height:800%;max-width:none;top:-400%;left:0"/></div><div style="position:relative;width:100%;height:12.5%;overflow:hidden"><img src="https://phys.libretexts.org/@api/deki/files/3343/JupiterMoons.PNG?revision=1" referrerpolicy="no-referrer" alt="" style="position:absolute;width:100%;height:800%;max-width:none;top:-300%;left:0"/></div><div style="position:relative;width:100%;height:12.5%;overflow:hidden"><img src="https://phys.libretexts.org/@api/deki/files/3343/JupiterMoons.PNG?revision=1" referrerpolicy="no-referrer" alt="" style="position:absolute;width:100%;height:800%;max-width:none;top:-200%;left:0"/></div><div style="position:relative;width:100%;height:12.5%;overflow:hidden"><img src="https://phys.libretexts.org/@api/deki/files/3343/JupiterMoons.PNG?revision=1" referrerpolicy="no-referrer" alt="" style="position:absolute;width:100%;height:800%;max-width:none;top:-100%;left:0"/></div><div style="position:relative;width:100%;height:12.5%;overflow:hidden"><img src="https://phys.libretexts.org/@api/deki/files/3343/JupiterMoons.PNG?revision=1" referrerpolicy="no-referrer" alt="" style="position:absolute;width:100%;height:800%;max-width:none;top:-0%;left:0"/></div></div></foreignObject><g id="motion-diagram" transform="translate(470 0)"><circle cx="260" cy="142" r="95" fill="none" stroke="var(--border)" stroke-width="2"/>
<line x1="150" x2="370" y1="142" y2="142" stroke="var(--muted-foreground)"/>
<line x1="260" x2="260" y1="37" y2="247" stroke="var(--border)"/>
<use href="#jupiter-cartoon" x="240" y="122" width="40" height="40"/>
<line id="s-radius" x1="260" y1="142" x2="355" y2="142" stroke="var(--muted-foreground)" stroke-width="2"/>
<circle id="s-moon" r="5" fill="var(--viz-series-1)"/>
<line id="s-vector" stroke="var(--viz-series-1)" stroke-width="2.5" marker-end="url(#s-arr)"/>
<text id="s-vector-label" text-anchor="middle" fill="currentColor" font-size="17" font-weight="700" style="paint-order:stroke;stroke:var(--background);stroke-width:4"></text>
<line id="s-drop" stroke="var(--viz-series-2)" stroke-dasharray="4 5"/>
<text x="260" y="264" text-anchor="middle" fill="currentColor" font-size="19" font-weight="700">望遠鏡裡：木衛左右移動</text>
<rect x="140" y="276" width="240" height="38" rx="3" fill="#111820"/>
<line x1="148" y1="295" x2="372" y2="295" stroke="#637185" stroke-width=".6"/>
<use href="#jupiter-cartoon" x="243" y="278" width="34" height="34"/>
<circle id="s-shadow" cy="295" r="4" fill="#f5e4bd"/>
<line id="s-proj" y1="295" y2="295" stroke="var(--viz-series-2)" stroke-width="2.5" marker-end="url(#s-arr2)"/>
<text id="s-proj-label" y="340" text-anchor="middle" fill="currentColor" font-size="17" font-weight="700"></text>
<line x1="165" x2="165" y1="350" y2="650" stroke="var(--border)" stroke-dasharray="3 5"/>
<line x1="260" x2="260" y1="350" y2="650" stroke="var(--border)" stroke-dasharray="3 5"/>
<line x1="355" x2="355" y1="350" y2="650" stroke="var(--border)" stroke-dasharray="3 5"/>
<text x="260" y="370" text-anchor="middle" fill="currentColor" font-size="19" font-weight="700">把不同時間的投影量連起來</text>
<g fill="currentColor" font-size="16" text-anchor="middle"><text id="s-neg" x="165" y="397">−R</text><text x="260" y="397">0</text><text id="s-plus" x="355" y="397">+R</text></g>
<line x1="130" y1="410" x2="380" y2="410" stroke="var(--muted-foreground)"/>
<line x1="130" y1="410" x2="130" y2="648" stroke="var(--muted-foreground)"/>
<g fill="currentColor" font-size="15" text-anchor="end"><text x="120" y="416">0</text><text x="120" y="471">T/4</text><text x="120" y="526">T/2</text><text x="120" y="581">3T/4</text><text x="120" y="636">T</text><text x="123" y="665">時間 t ↓</text></g>
<text id="s-axis" x="382" y="414" fill="currentColor" font-size="15">位置 x →</text>
<g id="s-samples"></g>
<path id="s-curve" fill="none" stroke="var(--viz-series-2)" stroke-width="3"/>
<line id="s-now" x1="130" x2="380" stroke="var(--viz-series-2)" stroke-dasharray="4 4" opacity=".5"/>
<line id="s-align" stroke="var(--viz-series-2)" stroke-dasharray="3 5" opacity=".4"/>
<circle id="s-plot" r="5" fill="var(--viz-series-2)"/>
</g><g fill="currentColor" text-anchor="middle"><text x="260" y="375" font-size="20">從左右位置，看出三角函數關係</text><text id="s-formula" x="260" y="443" font-size="47" font-weight="700">x＝R cos(ωt)</text><text x="260" y="492" font-size="27">θ＝ωt　　x＝R cosθ</text><text id="s-readout" x="260" y="540" font-size="22"></text><text x="260" y="586" font-size="18">位置左右移動，時間往下排列</text><text x="260" y="621" font-size="16">右側曲線是時間紀錄，實際軌道仍是圓</text><text x="260" y="649" font-size="14">等速圓周近似；右端起算；向量依各自最大值縮放</text></g></svg>
</div>
<script>(()=>{const root=document.getElementById('shm-visual'),$=id=>root.querySelector('#'+id),slider=$('s-time'),play=$('s-play');let p=0,mode=['pos','vel','acc'].includes(location.hash.slice(1))?location.hash.slice(1):'pos',running=false,last=0,frame=0;const cfg={pos:['位置 x →','x＝R cos(ωt)','位置 r','位移 x','R'],vel:['速度 vₓ →','vₓ＝−Rω sin(ωt)','速度 v','速度 vₓ','Rω'],acc:['加速度 aₓ →','aₓ＝−Rω² cos(ωt)','加速度 a','加速度 aₓ','Rω²']};function val(q){let t=2*Math.PI*q;return mode==='pos'?Math.cos(t):mode==='vel'?-Math.sin(t):-Math.cos(t)}function attr(id,k,v){$(id).setAttribute(k,v)}function draw(){let t=p*2*Math.PI,c=Math.cos(t),s=Math.sin(t),x=260+95*c,y=142-95*s,tx=mode==='pos'?260:x,ty=mode==='pos'?142:y,dx=mode==='pos'?95*c:mode==='vel'?-65*s:-65*c,dy=mode==='pos'?-95*s:mode==='vel'?-65*c:65*s;attr('s-radius','x2',x);attr('s-radius','y2',y);attr('s-moon','cx',x);attr('s-moon','cy',y);for(const [k,v]of Object.entries({x1:tx,y1:ty,x2:tx+dx,y2:ty+dy}))attr('s-vector',k,v);attr('s-drop','x1',x);attr('s-drop','x2',x);attr('s-drop','y1',y);attr('s-drop','y2',276);attr('s-shadow','cx',x);let len=Math.hypot(dx,dy);attr('s-vector-label','x',Math.max(95,Math.min(405,tx+dx/2+20*dy/len)));attr('s-vector-label','y',Math.max(45,Math.min(241,ty+dy/2-20*dx/len)));$('s-vector-label').textContent=cfg[mode][2];let sx=mode==='pos'?260:x,ex=mode==='pos'?x:x+dx;attr('s-proj','x1',sx);attr('s-proj','x2',ex);attr('s-proj','visibility',Math.abs(ex-sx)<2?'hidden':'visible');attr('s-proj-label','x',(sx+ex)/2);$('s-proj-label').textContent=cfg[mode][3]+(Math.abs(ex-sx)<2?'＝0':'');let d='',steps=Math.max(1,Math.ceil(p*220));for(let i=0;i<=steps;i++){let q=p*i/steps;d+=(i?' L ':'M ')+(260+95*val(q)).toFixed(2)+' '+(410+220*q).toFixed(2)}attr('s-curve','d',d);let gx=260+95*val(p),gy=410+220*p;attr('s-plot','cx',gx);attr('s-plot','cy',gy);attr('s-now','y1',gy);attr('s-now','y2',gy);attr('s-align','x1',x);attr('s-align','x2',gx);attr('s-align','y1',314);attr('s-align','y2',gy);attr('s-align','visibility',mode==='pos'?'visible':'hidden');let samples='';for(let q=0;q<=p+1e-8;q+=.125)samples+='<circle cx="'+(260+95*val(q))+'" cy="'+(410+220*q)+'" r="3" fill="var(--viz-series-2)"/>';$('s-samples').innerHTML=samples;$('s-axis').textContent=cfg[mode][0];$('s-neg').textContent='−'+cfg[mode][4];$('s-plus').textContent='+'+cfg[mode][4];$('s-formula').textContent=cfg[mode][1];attr('s-formula','font-size',mode==='pos'?47:mode==='vel'?37:34);$('s-readout').textContent=cfg[mode][0].replace(' →','')+'/'+cfg[mode][4]+'＝'+(Math.abs(val(p))<1e-9?0:val(p)).toFixed(2);slider.value=Math.round(p*1000);$('s-value').textContent=p.toFixed(2)+' T';for(const k of ['pos','vel','acc'])$('s-'+k).setAttribute('aria-pressed',String(k===mode))}function tick(now){if(!running)return;if(last)p=Math.min(1,p+(now-last)/18000);last=now;draw();if(p>=1){running=false;play.textContent='再播放';return}frame=requestAnimationFrame(tick)}play.onclick=()=>{if(running){running=false;cancelAnimationFrame(frame);play.textContent='繼續';return}if(p>=1)p=0;running=true;last=0;play.textContent='暫停';frame=requestAnimationFrame(tick)};slider.oninput=()=>{running=false;cancelAnimationFrame(frame);play.textContent='繼續';p=+slider.value/1000;draw()};$('s-reset').onclick=()=>{running=false;cancelAnimationFrame(frame);p=0;play.textContent='播放一週期';draw()};for(const k of ['pos','vel','acc'])$('s-'+k).onclick=()=>{mode=k;history.replaceState(null,'','#'+k);draw()};draw()})();</script>
