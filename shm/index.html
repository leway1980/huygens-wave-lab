<!doctype html><html lang="zh-Hant" data-layout="stacked-sidebar-v4"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>簡諧運動｜圓周運動與投影</title><style>
:root{--foreground:#17233b;--background:#f6f8fb;--border:#c4cfdb;--muted-foreground:#6c788d;--viz-series-1:#2269b5;--viz-series-2:#d5682b;font-family:system-ui,sans-serif;color:var(--foreground);background:var(--background)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
main{height:100dvh;padding:12px 22px 8px;display:flex;flex-direction:column;gap:7px}
h1{margin:0;font-size:clamp(22px,2vw,32px);line-height:1.2}.subtitle{margin:0;color:#4b5b73;font-size:14px}
#shm-visual{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.45fr);gap:34px}
.panel{min-width:0;min-height:0;display:flex;flex-direction:column;text-align:center}
h2{font-size:clamp(18px,1.5vw,25px);line-height:1.3;margin:4px 0 12px;flex:none}
.observation-panel{border-right:1px solid #dfe5ee;padding-right:28px}.observation-wrap{width:100%;aspect-ratio:835/500;margin:8px 0 0}
.observation-note{font-size:clamp(15px,1.3vw,22px);line-height:1.8;margin:18px 0 0}.observation-note small{display:block;font-size:.8em;color:#53647b;margin-top:8px}
.viz-controls{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;margin:0 0 5px}
.control-row{display:flex;justify-content:center;align-items:center;gap:7px;flex-wrap:wrap;width:100%}
.btn{border:1px solid #c4cfdb;border-radius:8px;padding:6px 11px;background:white;color:#21304c;font:inherit;font-size:15px;line-height:1.3;cursor:pointer}
.btn-primary{background:#205fa8;color:white;border-color:#205fa8}.btn[aria-pressed="true"]{background:#d6e8fa;border-color:#397bbd;color:#123d73;font-weight:700}
.time-control{font-size:14px}.form-range{accent-color:#205fa8;width:38%;max-width:270px;min-width:140px}
svg{display:block;flex:1;min-height:0;width:100%;font-family:inherit;overflow:visible}
.svg-heading{text-anchor:middle;fill:currentColor;font-size:19px;font-weight:700}
.vector-label{fill:currentColor;font-size:17px;font-weight:700;paint-order:stroke;stroke:var(--background);stroke-width:4}
.formula{font-size:36px;font-weight:750;fill:currentColor;text-anchor:middle}
[data-mode="vel"] .formula{font-size:33px}[data-mode="acc"] .formula{font-size:31px}
.formula-detail{font-size:21px;fill:currentColor;text-anchor:middle}.readout{font-size:16px;fill:#355c86;text-anchor:middle}
.graph-note{flex:none;font-size:11px;line-height:1.4;color:#53647b;margin:3px 0 0}
footer{flex:none;font-size:10px;line-height:1.3;color:#58667a}
@media(min-width:1700px){main{padding:16px 30px 10px;gap:10px}.btn{font-size:18px;padding:8px 14px}.time-control{font-size:17px}.viz-controls{gap:8px}}
@media(max-height:700px) and (min-width:851px){main{padding:7px 16px;gap:4px}h1{font-size:24px}.subtitle{font-size:12px}h2{font-size:18px;margin:2px 0 6px}.btn{font-size:13px;padding:4px 8px}.viz-controls{gap:3px}.graph-note{font-size:10px}.observation-note{font-size:15px}}
@media(max-width:850px){html,body{height:auto;overflow:auto}main{height:auto;padding:12px}#shm-visual{display:flex;flex-direction:column;gap:22px}.observation-panel{border-right:0;border-bottom:1px solid #dfe5ee;padding:0 0 18px}.observation-wrap{max-width:600px;align-self:center}.orbit-panel svg{flex:none;height:auto;aspect-ratio:720/700}.graph-note{font-size:12px}}

/* Keep the diagram in one uninterrupted vertical column; controls sit beside it. */
#shm-visual{grid-template-columns:minmax(0,.8fr) minmax(0,1.9fr);gap:28px}
.orbit-panel{display:grid;grid-template-columns:minmax(0,1fr) 156px;grid-template-rows:auto minmax(0,1fr) auto;column-gap:16px}
.orbit-panel>h2{grid-column:1;grid-row:1}
.orbit-panel>svg{grid-column:1;grid-row:2;height:100%}
.orbit-panel>.graph-note{grid-column:1;grid-row:3}
.viz-controls{grid-column:2;grid-row:1/4;align-self:start;justify-self:stretch;gap:14px;margin:0;padding:4px 0 0 16px;border-left:1px solid #dfe5ee}
.control-title{font-size:clamp(18px,1.5vw,25px);font-weight:700;line-height:1.3;margin:0 0 5px}
.control-row{flex-direction:column;gap:10px}.btn{width:100%;max-width:140px;min-height:36px}
.time-control{margin-top:7px;gap:12px}.form-range{width:100%;min-width:0;max-width:140px}
@media(max-height:700px) and (min-width:851px){.viz-controls{gap:10px;padding-top:2px}.control-row{gap:7px}.btn{min-height:30px}.control-title{font-size:18px}}
@media(max-width:1000px) and (min-width:851px){#shm-visual{gap:18px;grid-template-columns:minmax(0,.65fr) minmax(0,1.9fr)}.orbit-panel{grid-template-columns:minmax(0,1fr) 125px;column-gap:8px}.viz-controls{padding-left:8px}.btn{font-size:13px;padding:5px 6px}.observation-panel{padding-right:14px}}
@media(max-width:850px){#shm-visual{display:flex}.orbit-panel{display:grid;grid-template-columns:minmax(0,1fr) 126px;grid-template-rows:auto auto auto;column-gap:8px}.orbit-panel>svg{height:auto;aspect-ratio:720/700}.viz-controls{padding-left:8px}.btn{font-size:13px;padding:6px}.control-title{font-size:17px}.control-row{gap:7px}}
</style></head><body><main><h1>簡諧運動：圓周運動與投影</h1><p class="subtitle">木衛位置觀察 → 圓周運動與左右投影 → 三角函數關係</p><div id="shm-visual" data-mode="pos">
<section class="panel observation-panel"><h2>木衛的左右位置</h2><div class="observation-wrap"><div xmlns="http://www.w3.org/1999/xhtml" class="observation-montage" style="width:100%;height:100%"><div style="position:relative;width:100%;height:12.5%;overflow:hidden"><img src="https://phys.libretexts.org/@api/deki/files/3343/JupiterMoons.PNG?revision=1" referrerpolicy="no-referrer" alt="木衛位置觀察圖，時間由上至下" style="position:absolute;width:100%;height:800%;max-width:none;top:-700%;left:0"/></div><div style="position:relative;width:100%;height:12.5%;overflow:hidden"><img src="https://phys.libretexts.org/@api/deki/files/3343/JupiterMoons.PNG?revision=1" referrerpolicy="no-referrer" alt="" style="position:absolute;width:100%;height:800%;max-width:none;top:-600%;left:0"/></div><div style="position:relative;width:100%;height:12.5%;overflow:hidden"><img src="https://phys.libretexts.org/@api/deki/files/3343/JupiterMoons.PNG?revision=1" referrerpolicy="no-referrer" alt="" style="position:absolute;width:100%;height:800%;max-width:none;top:-500%;left:0"/></div><div style="position:relative;width:100%;height:12.5%;overflow:hidden"><img src="https://phys.libretexts.org/@api/deki/files/3343/JupiterMoons.PNG?revision=1" referrerpolicy="no-referrer" alt="" style="position:absolute;width:100%;height:800%;max-width:none;top:-400%;left:0"/></div><div style="position:relative;width:100%;height:12.5%;overflow:hidden"><img src="https://phys.libretexts.org/@api/deki/files/3343/JupiterMoons.PNG?revision=1" referrerpolicy="no-referrer" alt="" style="position:absolute;width:100%;height:800%;max-width:none;top:-300%;left:0"/></div><div style="position:relative;width:100%;height:12.5%;overflow:hidden"><img src="https://phys.libretexts.org/@api/deki/files/3343/JupiterMoons.PNG?revision=1" referrerpolicy="no-referrer" alt="" style="position:absolute;width:100%;height:800%;max-width:none;top:-200%;left:0"/></div><div style="position:relative;width:100%;height:12.5%;overflow:hidden"><img src="https://phys.libretexts.org/@api/deki/files/3343/JupiterMoons.PNG?revision=1" referrerpolicy="no-referrer" alt="" style="position:absolute;width:100%;height:800%;max-width:none;top:-100%;left:0"/></div><div style="position:relative;width:100%;height:12.5%;overflow:hidden"><img src="https://phys.libretexts.org/@api/deki/files/3343/JupiterMoons.PNG?revision=1" referrerpolicy="no-referrer" alt="" style="position:absolute;width:100%;height:800%;max-width:none;top:-0%;left:0"/></div></div></div><p class="observation-note">橫向：木衛的位置<br>由上往下：不同的觀察時間<small>看見左右往復，再用右邊的圓周運動解釋。</small></p></section>
<section class="panel orbit-panel" aria-label="木星動畫與下方時間曲線"><h2>圓周運動與時間曲線</h2>
<aside class="viz-controls" aria-label="動畫操作"><p class="control-title">操作面板</p><div class="control-row"><button type="button" class="btn btn-primary" id="s-play">播放一週期</button><button type="button" class="btn" id="s-reset">回到起點</button><button type="button" class="btn" id="s-pos" aria-pressed="true">位置 x</button><button type="button" class="btn" id="s-vel" aria-pressed="false">速度 vₓ</button><button type="button" class="btn" id="s-acc" aria-pressed="false">加速度 aₓ</button></div><div class="control-row time-control"><label for="s-time">時間 <span id="s-value">0.00 T</span></label><input id="s-time" class="form-range" type="range" min="0" max="1000" value="0" aria-label="選擇時間"></div></aside>
<svg id="s-orbit" role="img" aria-label="上方木衛圓周投影，下方對齊的三角函數時間曲線" viewBox="0 0 720 700" preserveAspectRatio="xMidYMin meet"><defs><marker id="s-arr" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 Z" fill="var(--viz-series-1)"/></marker><marker id="s-arr2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 Z" fill="var(--viz-series-2)"/></marker><radialGradient id="jupiter"><stop stop-color="#e5cc9e"/><stop offset=".5" stop-color="#bd9361"/><stop offset="1" stop-color="#775538"/></radialGradient><radialGradient id="jovian-shade" cx="35%" cy="30%" r="70%"><stop stop-color="#fff0ce"/><stop offset=".65" stop-color="#dfbf8f"/><stop offset="1" stop-color="#8b694b"/></radialGradient><clipPath id="jovian-disc"><circle cx="50" cy="50" r="46"/></clipPath><symbol id="jupiter-cartoon" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="url(#jovian-shade)" stroke="#8f6c49" stroke-width="2"/><g clip-path="url(#jovian-disc)"><path d="M0 23 Q30 15 57 23 T100 21 L100 31 Q70 35 43 29 T0 32Z" fill="#be8f60"/><path d="M0 37 Q24 32 50 39 T100 37 L100 47 Q72 51 48 45 T0 47Z" fill="#a56c47"/><path d="M0 50 Q28 47 51 52 T100 51 L100 58 Q75 61 48 56 T0 59Z" fill="#f9e4ba"/><path d="M0 62 Q20 57 47 64 T100 62 L100 73 Q72 76 50 70 T0 72Z" fill="#b67f54"/><path d="M0 81 Q27 75 51 82 T100 80 L100 87 Q72 91 46 86 T0 89Z" fill="#c99c70"/><ellipse cx="67" cy="67" rx="14" ry="8" fill="#be6450" transform="rotate(-9 67 67)"/><ellipse cx="67" cy="66" rx="8" ry="4" fill="#db9472" transform="rotate(-9 67 66)"/><ellipse cx="30" cy="28" rx="12" ry="25" fill="#fff7dc" opacity=".16"/></g></symbol></defs>
<text x="170" y="42" class="svg-heading" text-anchor="end">俯視軌道</text>
<circle cx="360" cy="127" r="105" fill="none" stroke="var(--border)" stroke-width="2"/><line x1="240" x2="480" y1="127" y2="127" stroke="var(--muted-foreground)"/><line x1="360" x2="360" y1="12" y2="242" stroke="var(--border)"/>
<line id="s-radius" x1="360" y1="127" x2="465" y2="127" stroke="var(--muted-foreground)" stroke-width="2"/><use href="#jupiter-cartoon" x="338" y="105" width="44" height="44"/><circle id="s-moon" r="5" fill="var(--viz-series-1)"/><line id="s-vector" stroke="var(--viz-series-1)" stroke-width="2.5" marker-end="url(#s-arr)"/><text id="s-vector-label" text-anchor="middle" class="vector-label"></text>
<line id="s-drop" stroke="var(--viz-series-2)" stroke-dasharray="4 5"/><text x="170" y="280" class="svg-heading">望遠鏡裡</text>
<rect x="230" y="258" width="260" height="38" rx="4" fill="#111820"/><line x1="240" x2="480" y1="277" y2="277" stroke="#637185" stroke-width=".7"/><use href="#jupiter-cartoon" x="342" y="259" width="36" height="36"/><circle id="s-shadow" cy="277" r="4" fill="#f5e4bd"/><line id="s-proj" y1="277" y2="277" stroke="var(--viz-series-2)" stroke-width="2.5" marker-end="url(#s-arr2)"/><text id="s-proj-label" y="280" class="vector-label" text-anchor="middle" transform="translate(0,28)"></text>
<text id="s-formula" x="360" y="349" class="formula">x＝R cos(ωt)</text><text x="360" y="376" class="formula-detail">θ＝ωt　　x＝R cosθ</text><text id="s-readout" x="575" y="376" class="readout"></text>
<text x="360" y="407" class="svg-heading">把不同時間的投影量連起來</text>
<g id="s-graph" role="group" aria-label="橫向為投影量，時間由上往下">
<g stroke="var(--border)" stroke-dasharray="3 5"><line x1="255" x2="255" y1="432" y2="676"/><line x1="360" x2="360" y1="432" y2="676"/><line x1="465" x2="465" y1="432" y2="676"/></g>
<g fill="currentColor" font-size="17" text-anchor="middle"><text id="s-neg" x="255" y="432">−R</text><text x="360" y="432">0</text><text id="s-plus" x="465" y="432">+R</text></g>
<line x1="220" x2="495" y1="440" y2="440" stroke="var(--muted-foreground)"/><line x1="220" x2="220" y1="440" y2="675" stroke="var(--muted-foreground)"/>
<g fill="currentColor" font-size="16" text-anchor="end"><text x="209" y="446">0</text><text x="209" y="503">T/4</text><text x="209" y="560">T/2</text><text x="209" y="617">3T/4</text><text x="209" y="674">T</text><text x="225" y="698">時間 t ↓</text></g><text id="s-axis" x="505" y="446" fill="currentColor" font-size="17">位置 x →</text>
<g id="s-samples"></g><path id="s-curve" fill="none" stroke="var(--viz-series-2)" stroke-width="3"/><line id="s-now" x1="220" x2="495" stroke="var(--viz-series-2)" stroke-dasharray="4 4" opacity=".5"/><circle id="s-plot" r="4" fill="var(--viz-series-2)"/></g></svg>
<p class="graph-note">上下共用位置尺度：−R、0、+R 對齊。曲線是時間紀錄，實際軌道仍是圓。<br>等速圓周近似，右端起算；速度與加速度向量依各自最大值縮放。</p></section></div><script>(()=>{const root=document.getElementById('shm-visual'),$=id=>root.querySelector('#'+id),slider=$('s-time'),play=$('s-play');let p=0,mode=['pos','vel','acc'].includes(location.hash.slice(1))?location.hash.slice(1):'pos',running=false,last=0,frame=0;const C=360,R=105,CY=127,G0=440,GH=228;const cfg={pos:['位置 x →','x＝R cos(ωt)','位置 r','位移 x','R'],vel:['速度 vₓ →','vₓ＝−Rω sin(ωt)','速度 v','速度 vₓ','Rω'],acc:['加速度 aₓ →','aₓ＝−Rω² cos(ωt)','加速度 a','加速度 aₓ','Rω²']};function val(q){const t=2*Math.PI*q;return mode==='pos'?Math.cos(t):mode==='vel'?-Math.sin(t):-Math.cos(t)}function attr(id,k,v){$(id).setAttribute(k,v)}function draw(){const t=p*2*Math.PI,c=Math.cos(t),s=Math.sin(t),x=C+R*c,y=CY-R*s,tx=mode==='pos'?C:x,ty=mode==='pos'?CY:y,dx=mode==='pos'?R*c:mode==='vel'?-65*s:-65*c,dy=mode==='pos'?-R*s:mode==='vel'?-65*c:65*s;attr('s-radius','x2',x);attr('s-radius','y2',y);attr('s-moon','cx',x);attr('s-moon','cy',y);for(const [k,v]of Object.entries({x1:tx,y1:ty,x2:tx+dx,y2:ty+dy}))attr('s-vector',k,v);attr('s-drop','x1',x);attr('s-drop','x2',x);attr('s-drop','y1',y);attr('s-drop','y2',263);attr('s-shadow','cx',x);const len=Math.hypot(dx,dy);attr('s-vector-label','x',Math.max(170,Math.min(550,tx+dx/2+20*dy/len)));attr('s-vector-label','y',Math.max(24,Math.min(242,ty+dy/2-20*dx/len)));$('s-vector-label').textContent=cfg[mode][2];const sx=mode==='pos'?C:x,ex=mode==='pos'?x:x+dx;attr('s-proj','x1',sx);attr('s-proj','x2',ex);attr('s-proj','visibility',Math.abs(ex-sx)<2?'hidden':'visible');attr('s-proj-label','x',(sx+ex)/2);$('s-proj-label').textContent=cfg[mode][3]+(Math.abs(ex-sx)<2?'＝0':'');let d='',steps=Math.max(1,Math.ceil(p*220));for(let i=0;i<=steps;i++){const q=p*i/steps;d+=(i?' L ':'M ')+(C+R*val(q)).toFixed(2)+' '+(G0+GH*q).toFixed(2)}attr('s-curve','d',d);const gx=C+R*val(p),gy=G0+GH*p;attr('s-plot','cx',gx);attr('s-plot','cy',gy);attr('s-now','y1',gy);attr('s-now','y2',gy);let samples='';for(let q=0;q<=p+1e-8;q+=.125)samples+='<circle cx="'+(C+R*val(q))+'" cy="'+(G0+GH*q)+'" r="3" fill="var(--viz-series-2)"/>';$('s-samples').innerHTML=samples;$('s-axis').textContent=cfg[mode][0];$('s-neg').textContent='−'+cfg[mode][4];$('s-plus').textContent='+'+cfg[mode][4];$('s-formula').textContent=cfg[mode][1];root.dataset.mode=mode;$('s-readout').textContent=cfg[mode][0].replace(' →','')+'/'+cfg[mode][4]+'＝'+(Math.abs(val(p))<1e-9?0:val(p)).toFixed(2);slider.value=Math.round(p*1000);$('s-value').textContent=p.toFixed(2)+' T';for(const k of ['pos','vel','acc'])$('s-'+k).setAttribute('aria-pressed',String(k===mode))}function tick(now){if(!running)return;if(last)p=Math.min(1,p+(now-last)/18000);last=now;draw();if(p>=1){running=false;play.textContent='再播放';return}frame=requestAnimationFrame(tick)}play.onclick=()=>{if(running){running=false;cancelAnimationFrame(frame);play.textContent='繼續';return}if(p>=1)p=0;running=true;last=0;play.textContent='暫停';frame=requestAnimationFrame(tick)};slider.oninput=()=>{running=false;cancelAnimationFrame(frame);play.textContent='繼續';p=+slider.value/1000;draw()};$('s-reset').onclick=()=>{running=false;cancelAnimationFrame(frame);p=0;play.textContent='播放一週期';draw()};for(const k of ['pos','vel','acc'])$('s-'+k).onclick=()=>{mode=k;history.replaceState(null,'','#'+k);draw()};draw()})();</script><footer>圖片：Benjamin Crowell／<a href="https://phys.libretexts.org/Bookshelves/Relativity/Special_Relativity_(Crowell)/01%3A_Spacetime/1.01%3A_Three_Models_of_Spacetime" target="_blank" rel="noopener">Physics LibreTexts</a> · <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>（時序重排；望遠鏡視角模擬）</footer></main></body></html>
