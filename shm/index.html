<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>簡諧運動｜圓周運動與投影</title><style>:root{--foreground:#17233b;--background:#fff;--border:#c4cfdb;--muted-foreground:#6c788d;--orange:#d66d22;--viz-series-1:#2269b5;--viz-series-2:#d5682b;font-family:system-ui,sans-serif}body{margin:0;background:#f6f8fb;color:var(--foreground)}main{max-width:1300px;margin:auto;padding:12px 18px}.title{margin:4px 0 7px;font-size:clamp(22px,3vw,34px)}.subtitle{margin:0 0 12px;color:#4b5b73}.btn{border:1px solid #c4cfdb;border-radius:8px;padding:9px 14px;background:white;color:#21304c;font:inherit;cursor:pointer}.btn-primary{background:#205fa8;color:white;border-color:#205fa8}.btn[aria-pressed="true"]{background:#d6e8fa;border-color:#397bbd;color:#123d73;font-weight:700}.form-range{accent-color:#205fa8}svg{max-height:70vh}footer{color:#58667a;font-size:14px}@media(max-width:600px){main{padding:10px}svg{max-height:none}.btn{padding:8px;font-size:14px}}</style></head><body><main><h1 class="title">簡諧運動：圓周運動與投影</h1><p class="subtitle">切換位置、速度與加速度，觀察圓周運動與投影的關係。</p><div id="shm-visual" style="padding:10px;color:var(--foreground)">
  <div class="viz-controls" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
    <button type="button" class="btn btn-primary" id="s-play">播放一週期</button>
    <button type="button" class="btn" id="s-reset">回到起點</button>
    <button type="button" class="btn" id="s-pos" aria-pressed="true">位置 x</button>
    <button type="button" class="btn" id="s-vel" aria-pressed="false">速度 vₓ</button>
    <button type="button" class="btn" id="s-acc" aria-pressed="false">加速度 aₓ</button>
    <label for="s-time">時間 <span id="s-value">0.00 T</span></label><input id="s-time" class="form-range" type="range" min="0" max="1000" value="0" style="width:150px" aria-label="選擇時間" />
  </div>
  <svg id="s-svg" role="img" aria-label="圓周運動及其位置、速度、加速度的水平投影和時間關係" viewBox="0 0 920 525" style="display:block;width:100%;height:auto;font-family:system-ui,sans-serif">
    <defs><marker id="s-arr" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 Z" fill="var(--viz-series-1)"/></marker><marker id="s-arr2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 Z" fill="var(--viz-series-2)"/></marker></defs>
    <text x="212" y="31" text-anchor="middle" fill="currentColor" font-size="22" font-weight="700">圓周運動</text>
    <text x="666" y="31" text-anchor="middle" fill="currentColor" font-size="22" font-weight="700">投影量與時間</text>
    <circle cx="212" cy="185" r="110" fill="none" stroke="var(--border)" stroke-width="2"/>
    <line x1="88" y1="185" x2="336" y2="185" stroke="var(--muted-foreground)" stroke-width="1.5"/><line x1="212" y1="58" x2="212" y2="311" stroke="var(--border)" stroke-width="1"/>
    <circle cx="212" cy="185" r="13" fill="var(--orange)"/><text x="212" y="190" text-anchor="middle" fill="var(--background)" font-size="13">O</text>
    <line id="s-radius" x1="212" y1="185" x2="322" y2="185" stroke="var(--muted-foreground)" stroke-width="2"/>
    <line id="s-vector" x1="212" y1="185" x2="322" y2="185" stroke="var(--viz-series-1)" stroke-width="4" marker-end="url(#s-arr)"/>
    <text id="s-vector-label" text-anchor="middle" fill="currentColor" font-size="18" font-weight="700" style="paint-order:stroke;stroke:var(--background);stroke-width:4;stroke-linejoin:round"></text>
    <line id="s-drop" x1="322" y1="185" x2="322" y2="389" stroke="var(--viz-series-2)" stroke-width="1.5" stroke-dasharray="5 6"/>
    <circle id="s-moon" cx="322" cy="185" r="9" fill="var(--viz-series-1)"/>
    <text x="212" y="351" text-anchor="middle" fill="currentColor" font-size="21" font-weight="700">影子：水平投影</text>
    <line x1="87" y1="389" x2="337" y2="389" stroke="var(--muted-foreground)" stroke-width="2"/><circle cx="212" cy="389" r="5" fill="var(--orange)"/>
    <circle id="s-shadow" cx="322" cy="389" r="8" fill="var(--viz-series-2)"/>
    <line id="s-proj" x1="212" y1="389" x2="322" y2="389" stroke="var(--viz-series-2)" stroke-width="5" marker-end="url(#s-arr2)"/>
    <text id="s-proj-label" x="267" y="371" text-anchor="middle" fill="currentColor" font-size="18" font-weight="700" style="paint-order:stroke;stroke:var(--background);stroke-width:4;stroke-linejoin:round"></text>
    <text x="102" y="422" text-anchor="middle" fill="currentColor" font-size="16">−R</text><text x="212" y="422" text-anchor="middle" fill="currentColor" font-size="16">0</text><text x="322" y="422" text-anchor="middle" fill="currentColor" font-size="16">+R</text>
    <line x1="462" y1="73" x2="462" y2="300" stroke="var(--muted-foreground)" stroke-width="2"/><line x1="462" y1="185" x2="865" y2="185" stroke="var(--muted-foreground)" stroke-width="2"/>
    <line x1="462" y1="85" x2="862" y2="85" stroke="var(--border)" stroke-dasharray="4 4"/><line x1="462" y1="285" x2="862" y2="285" stroke="var(--border)" stroke-dasharray="4 4"/>
    <text id="s-axis" x="420" y="65" fill="currentColor" font-size="18">x/R</text><text x="450" y="92" text-anchor="end" fill="currentColor" font-size="16">+1</text><text x="450" y="191" text-anchor="end" fill="currentColor" font-size="16">0</text><text x="450" y="291" text-anchor="end" fill="currentColor" font-size="16">−1</text>
    <text x="462" y="325" text-anchor="middle" fill="currentColor" font-size="16">0</text><text x="562" y="325" text-anchor="middle" fill="currentColor" font-size="16">T/4</text><text x="662" y="325" text-anchor="middle" fill="currentColor" font-size="16">T/2</text><text x="762" y="325" text-anchor="middle" fill="currentColor" font-size="16">3T/4</text><text x="862" y="325" text-anchor="middle" fill="currentColor" font-size="16">T</text><text x="845" y="211" fill="currentColor" font-size="16">時間</text>
    <path id="s-curve" fill="none" stroke="var(--viz-series-2)" stroke-width="4"/><circle id="s-plot" r="7" fill="var(--viz-series-2)"/>
    <text id="s-formula" x="660" y="379" text-anchor="middle" fill="currentColor" font-size="25" font-weight="700">x＝R cos(ωt)</text>
    <text id="s-readout" x="660" y="417" text-anchor="middle" fill="currentColor" font-size="19">x/R＝+1.00</text>
    <text x="460" y="475" fill="currentColor" font-size="15">起點在右端；等速圓周運動；箭頭按各自最大值縮放</text>
  </svg>
</div>
<script>
(()=>{const root=document.getElementById('shm-visual'),$=id=>root.querySelector('#'+id),slider=$('s-time'),play=$('s-play');let p=0,mode='pos',running=false,last=0,frame=0;const cfg={pos:['x/R','x＝R cos(ωt)'],vel:['vₓ/(Rω)','vₓ＝−Rω sin(ωt)'],acc:['aₓ/(Rω²)','aₓ＝−Rω² cos(ωt)']};function val(q){let t=2*Math.PI*q;return mode==='pos'?Math.cos(t):mode==='vel'?-Math.sin(t):-Math.cos(t)}function attr(id,key,v){$(id).setAttribute(key,v)}function draw(){let t=p*2*Math.PI,c=Math.cos(t),s=Math.sin(t),x=212+110*c,y=185-110*s;attr('s-radius','x2',x);attr('s-radius','y2',y);attr('s-moon','cx',x);attr('s-moon','cy',y);attr('s-drop','x1',x);attr('s-drop','x2',x);attr('s-drop','y1',y);attr('s-shadow','cx',x);let tx=mode==='pos'?212:x,ty=mode==='pos'?185:y,dx=mode==='pos'?110*c:mode==='vel'?-75*s:-75*c,dy=mode==='pos'?-110*s:mode==='vel'?-75*c:75*s;attr('s-vector','x1',tx);attr('s-vector','y1',ty);attr('s-vector','x2',tx+dx);attr('s-vector','y2',ty+dy);let sx=mode==='pos'?212:x,ex=mode==='pos'?x:x+dx;attr('s-proj','x1',sx);attr('s-proj','x2',ex);attr('s-proj','visibility',Math.abs(ex-sx)<2?'hidden':'visible');const vectorNames={pos:'位置 r⃗',vel:'速度 v⃗',acc:'加速度 a⃗'},projNames={pos:'位移 x⃗',vel:'速度 v⃗ₓ',acc:'加速度 a⃗ₓ'};let len=Math.hypot(dx,dy);attr('s-vector-label','x',Math.max(64,Math.min(370,tx+dx/2+22*dy/len)));attr('s-vector-label','y',Math.max(55,Math.min(313,ty+dy/2-22*dx/len)));$('s-vector-label').textContent=vectorNames[mode];attr('s-proj-label','x',(sx+ex)/2);$('s-proj-label').textContent=projNames[mode]+(Math.abs(ex-sx)<2?'＝0':'');let d='';const steps=Math.max(1,Math.ceil(p*200));for(let i=0;i<=steps;i++){let q=p*i/steps;d+=(i?' L ':'M ')+(462+400*q).toFixed(1)+' '+(185-100*val(q)).toFixed(1)}attr('s-curve','d',d);attr('s-plot','cx',462+400*p);attr('s-plot','cy',185-100*val(p));$('s-axis').textContent=cfg[mode][0];$('s-formula').textContent=cfg[mode][1];$('s-readout').textContent=cfg[mode][0]+'＝'+(val(p)>=0?'+':'')+val(p).toFixed(2);slider.value=Math.round(p*1000);$('s-value').textContent=p.toFixed(2)+' T';for(const k of ['pos','vel','acc'])$('s-'+k).setAttribute('aria-pressed',String(k===mode))}function tick(now){if(!running)return;if(last)p=Math.min(1,p+(now-last)/18000);last=now;draw();if(p>=1){running=false;play.textContent='再播放';return}frame=requestAnimationFrame(tick)}play.onclick=()=>{if(running){running=false;cancelAnimationFrame(frame);play.textContent='繼續';return}if(p>=1)p=0;running=true;last=0;play.textContent='暫停';frame=requestAnimationFrame(tick)};slider.oninput=()=>{running=false;cancelAnimationFrame(frame);play.textContent='繼續';p=Number(slider.value)/1000;draw()};$('s-reset').onclick=()=>{running=false;cancelAnimationFrame(frame);p=0;play.textContent='播放一週期';draw()};for(const k of ['pos','vel','acc'])$('s-'+k).onclick=()=>{mode=k;draw()};draw()})();
</script>
</main></body></html>
