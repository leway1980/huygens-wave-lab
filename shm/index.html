<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>簡諧運動｜圓周運動與投影</title><style>
:root{--foreground:#17233b;--background:#f6f8fb;--border:#c4cfdb;--muted-foreground:#6c788d;--viz-series-1:#2269b5;--viz-series-2:#d5682b;font-family:system-ui,sans-serif;color:var(--foreground);background:var(--background)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
main{height:100dvh;display:flex;flex-direction:column;gap:10px;padding:14px 22px 10px}
.title{margin:0;font-size:clamp(22px,2.1vw,32px);line-height:1.2}.subtitle{margin:0;color:#4b5b73;font-size:14px}
#shm-visual{display:grid;grid-template-columns:1fr 1.08fr 1.12fr;gap:20px;flex:1;min-height:0}
.panel{display:flex;flex-direction:column;min-width:0;min-height:0;text-align:center}
.panel+.panel{border-left:1px solid #dfe5ee;padding-left:20px}
h2{font-size:clamp(18px,1.55vw,25px);line-height:1.25;margin:8px 0 14px}
.observation-wrap{width:100%;aspect-ratio:835/500;margin-top:18px}.observation-note{margin:20px 0 0;font-size:clamp(14px,1.2vw,20px);line-height:1.8}
.observation-note small{display:block;font-size:.85em;color:#53647b;margin-top:8px}
.viz-controls{flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;margin:0 0 4px;padding:2px 0 10px}
.control-row{display:flex;justify-content:center;align-items:center;gap:7px;flex-wrap:wrap;width:100%}
.btn{border:1px solid #c4cfdb;border-radius:8px;padding:7px 12px;background:white;color:#21304c;font:inherit;font-size:16px;line-height:1.3;cursor:pointer}
.btn-primary{background:#205fa8;color:white;border-color:#205fa8}.btn[aria-pressed="true"]{background:#d6e8fa;border-color:#397bbd;color:#123d73;font-weight:700}
.time-control{font-size:15px}.form-range{accent-color:#205fa8;width:46%;max-width:220px;min-width:100px}
svg{display:block;width:100%;min-height:0;flex:1;font-family:inherit;overflow:visible}
.svg-heading{text-anchor:middle;fill:currentColor;font-size:21px;font-weight:700}
.vector-label{fill:currentColor;font-size:19px;font-weight:700;paint-order:stroke;stroke:var(--background);stroke-width:4}
.formula-block{flex:none;margin:3px 0 7px}.formula{font-size:clamp(27px,3.1vw,54px);font-weight:750;line-height:1.25;white-space:nowrap}
[data-mode="vel"] .formula{font-size:clamp(25px,2.65vw,48px)}[data-mode="acc"] .formula{font-size:clamp(23px,2.4vw,44px)}
.formula-detail{font-size:clamp(16px,1.6vw,26px);margin-top:10px}.readout{font-size:clamp(15px,1.4vw,22px);margin-top:9px;color:#355c86}
.graph-note{margin:2px 0;font-size:13px;color:#53647b}footer{flex:none;font-size:10px;line-height:1.3;color:#58667a}
@media(min-width:1700px){main{padding:18px 30px 12px;gap:14px}#shm-visual{gap:28px}.panel+.panel{padding-left:28px}.btn{font-size:18px;padding:8px 15px}.time-control{font-size:17px}}
@media(max-height:700px) and (min-width:851px){main{gap:5px;padding:9px 16px}.subtitle{font-size:12px}h2{margin:5px 0 8px}.viz-controls{gap:5px;padding-bottom:4px}.btn{padding:5px 9px;font-size:14px}.observation-wrap{margin-top:8px}.observation-note{margin-top:12px}.formula-detail{margin-top:6px}.readout{margin-top:5px}}
@media(max-width:850px){html,body{height:auto;overflow:auto}main{height:auto;padding:12px}#shm-visual{grid-template-columns:1fr;gap:22px}.panel+.panel{border-left:0;border-top:1px solid #dfe5ee;padding:20px 0 0}.observation-wrap{max-width:600px;align-self:center}.panel svg{flex:none;height:500px}.formula{font-size:40px}}
</style></head><body><main><h1 class="title">簡諧運動：圓周運動與投影</h1><p class="subtitle">木衛位置觀察 → 圓周運動與左右投影 → 三角函數關係</p>
<div id="shm-visual" data-mode="pos">
<section class="panel observation-panel" aria-labelledby="observation-title"><h2 id="observation-title">木衛的左右位置</h2><div class="observation-wrap"><div xmlns="http://www.w3.org/1999/xhtml" class="observation-montage" style="width:100%;height:100%"><div style="position:relative;width:100%;height:12.5%;overflow:hidden"><img src="https://phys.libretexts.org/@api/deki/files/3343/JupiterMoons.PNG?revision=1" referrerpolicy="no-referrer" alt="木衛位置觀察圖，時間由上至下" style="position:absolute;width:100%;height:800%;max-width:none;top:-700%;left:0"/></div><div style="position:relative;width:100%;height:12.5%;overflow:hidden"><img src="https://phys.libretexts.org/@api/deki/files/3343/JupiterMoons.PNG?revision=1" referrerpolicy="no-referrer" alt="" style="position:absolute;width:100%;height:800%;max-width:none;top:-600%;left:0"/></div><div style="position:relative;width:100%;height:12.5%;overflow:hidden"><img src="https://phys.libretexts.org/@api/deki/files/3343/JupiterMoons.PNG?revision=1" referrerpolicy="no-referrer" alt="" style="position:absolute;width:100%;height:800%;max-width:none;top:-500%;left:0"/></div><div style="position:relative;width:100%;height:12.5%;overflow:hidden"><img src="https://phys.libretexts.org/@api/deki/files/3343/JupiterMoons.PNG?revision=1" referrerpolicy="no-referrer" alt="" style="position:absolute;width:100%;height:800%;max-width:none;top:-400%;left:0"/></div><div style="position:relative;width:100%;height:12.5%;overflow:hidden"><img src="https://phys.libretexts.org/@api/deki/files/3343/JupiterMoons.PNG?revision=1" referrerpolicy="no-referrer" alt="" style="position:absolute;width:100%;height:800%;max-width:none;top:-300%;left:0"/></div><div style="position:relative;width:100%;height:12.5%;overflow:hidden"><img src="https://phys.libretexts.org/@api/deki/files/3343/JupiterMoons.PNG?revision=1" referrerpolicy="no-referrer" alt="" style="position:absolute;width:100%;height:800%;max-width:none;top:-200%;left:0"/></div><div style="position:relative;width:100%;height:12.5%;overflow:hidden"><img src="https://phys.libretexts.org/@api/deki/files/3343/JupiterMoons.PNG?revision=1" referrerpolicy="no-referrer" alt="" style="position:absolute;width:100%;height:800%;max-width:none;top:-100%;left:0"/></div><div style="position:relative;width:100%;height:12.5%;overflow:hidden"><img src="https://phys.libretexts.org/@api/deki/files/3343/JupiterMoons.PNG?revision=1" referrerpolicy="no-referrer" alt="" style="position:absolute;width:100%;height:800%;max-width:none;top:-0%;left:0"/></div></div></div><p class="observation-note">橫向：木衛的位置<br>由上往下：不同的觀察時間<small>看見左右往復，再用中間的圓周運動解釋。</small></p></section>
<section class="panel orbit-panel" aria-label="圓周運動動畫與操作"><div class="viz-controls" aria-label="動畫操作">
<div class="control-row"><button type="button" class="btn btn-primary" id="s-play">播放一週期</button><button type="button" class="btn" id="s-reset">回到起點</button></div>
<div class="control-row"><button type="button" class="btn" id="s-pos" aria-pressed="true">位置 x</button><button type="button" class="btn" id="s-vel" aria-pressed="false">速度 vₓ</button><button type="button" class="btn" id="s-acc" aria-pressed="false">加速度 aₓ</button></div>
<div class="control-row time-control"><label for="s-time">時間 <span id="s-value">0.00 T</span></label><input id="s-time" class="form-range" type="range" min="0" max="1000" value="0" aria-label="選擇時間"/></div></div><svg id="s-orbit" role="img" aria-label="木衛繞木星運動，以及望遠鏡裡的左右位置" viewBox="0 0 520 540">
<defs><marker id="s-arr" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 Z" fill="var(--viz-series-1)"/></marker><marker id="s-arr2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 Z" fill="var(--viz-series-2)"/></marker><radialGradient id="jupiter"><stop stop-color="#e5cc9e"/><stop offset=".5" stop-color="#bd9361"/><stop offset="1" stop-color="#775538"/></radialGradient><radialGradient id="jovian-shade" cx="35%" cy="30%" r="70%"><stop stop-color="#fff0ce"/><stop offset=".65" stop-color="#dfbf8f"/><stop offset="1" stop-color="#8b694b"/></radialGradient><clipPath id="jovian-disc"><circle cx="50" cy="50" r="46"/></clipPath><symbol id="jupiter-cartoon" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="url(#jovian-shade)" stroke="#8f6c49" stroke-width="2"/><g clip-path="url(#jovian-disc)"><path d="M0 23 Q30 15 57 23 T100 21 L100 31 Q70 35 43 29 T0 32Z" fill="#be8f60"/><path d="M0 37 Q24 32 50 39 T100 37 L100 47 Q72 51 48 45 T0 47Z" fill="#a56c47"/><path d="M0 50 Q28 47 51 52 T100 51 L100 58 Q75 61 48 56 T0 59Z" fill="#f9e4ba"/><path d="M0 62 Q20 57 47 64 T100 62 L100 73 Q72 76 50 70 T0 72Z" fill="#b67f54"/><path d="M0 81 Q27 75 51 82 T100 80 L100 87 Q72 91 46 86 T0 89Z" fill="#c99c70"/><ellipse cx="67" cy="67" rx="14" ry="8" fill="#be6450" transform="rotate(-9 67 67)"/><ellipse cx="67" cy="66" rx="8" ry="4" fill="#db9472" transform="rotate(-9 67 66)"/><ellipse cx="30" cy="28" rx="12" ry="25" fill="#fff7dc" opacity=".16"/></g></symbol></defs>
<text x="260" y="26" class="svg-heading">俯視：木衛繞木星運動</text>
<circle cx="260" cy="200" r="140" fill="none" stroke="var(--border)" stroke-width="2"/>
<line x1="100" x2="420" y1="200" y2="200" stroke="var(--muted-foreground)"/>
<line x1="260" x2="260" y1="45" y2="355" stroke="var(--border)"/>
<line id="s-radius" x1="260" y1="200" x2="400" y2="200" stroke="var(--muted-foreground)" stroke-width="2"/>
<use href="#jupiter-cartoon" x="233" y="173" width="54" height="54"/>
<circle id="s-moon" r="6" fill="var(--viz-series-1)"/>
<line id="s-vector" stroke="var(--viz-series-1)" stroke-width="2.5" marker-end="url(#s-arr)"/>
<text id="s-vector-label" text-anchor="middle" class="vector-label"></text>
<line id="s-drop" stroke="var(--viz-series-2)" stroke-dasharray="4 5"/>
<text x="260" y="393" class="svg-heading">望遠鏡裡：木衛左右移動</text>
<rect x="90" y="413" width="340" height="50" rx="4" fill="#111820"/>
<line x1="100" y1="438" x2="420" y2="438" stroke="#637185" stroke-width=".7"/>
<use href="#jupiter-cartoon" x="238" y="416" width="44" height="44"/>
<circle id="s-shadow" cy="438" r="5" fill="#f5e4bd"/>
<line id="s-proj" y1="438" y2="438" stroke="var(--viz-series-2)" stroke-width="2.5" marker-end="url(#s-arr2)"/>
<text id="s-proj-label" y="496" text-anchor="middle" class="vector-label"></text>
<g text-anchor="middle" fill="var(--muted-foreground)" font-size="17"><text x="120" y="528">−R</text><text x="260" y="528">0</text><text x="400" y="528">+R</text></g>
</svg></section>
<section class="panel relationship-panel" aria-labelledby="relationship-title"><h2 id="relationship-title">三角函數關係</h2><div class="formula-block"><div id="s-formula" class="formula">x＝R cos(ωt)</div><div class="formula-detail">θ＝ωt　　x＝R cosθ</div><div id="s-readout" class="readout"></div></div><svg id="s-graph" role="img" aria-label="橫向為所選物理量、時間由上往下的三角函數曲線" viewBox="0 0 520 510">
<text x="250" y="25" class="svg-heading">把不同時間的投影量連起來</text>
<line x1="130" x2="130" y1="65" y2="455" stroke="var(--border)" stroke-dasharray="3 5"/>
<line x1="250" x2="250" y1="65" y2="455" stroke="var(--border)" stroke-dasharray="3 5"/>
<line x1="370" x2="370" y1="65" y2="455" stroke="var(--border)" stroke-dasharray="3 5"/>
<g fill="currentColor" font-size="18" text-anchor="middle"><text id="s-neg" x="130" y="61">−R</text><text x="250" y="61">0</text><text id="s-plus" x="370" y="61">+R</text></g>
<line x1="90" y1="80" x2="400" y2="80" stroke="var(--muted-foreground)"/>
<line x1="90" y1="80" x2="90" y2="455" stroke="var(--muted-foreground)"/>
<g fill="currentColor" font-size="17" text-anchor="end"><text x="78" y="86">0</text><text x="78" y="176">T/4</text><text x="78" y="266">T/2</text><text x="78" y="356">3T/4</text><text x="78" y="446">T</text><text x="97" y="488">時間 t ↓</text></g>
<text id="s-axis" x="405" y="85" fill="currentColor" font-size="17">位置 x →</text>
<g id="s-samples"></g><path id="s-curve" fill="none" stroke="var(--viz-series-2)" stroke-width="3"/>
<line id="s-now" x1="90" x2="400" stroke="var(--viz-series-2)" stroke-dasharray="4 4" opacity=".5"/>
<circle id="s-plot" r="5" fill="var(--viz-series-2)"/>
</svg><p class="graph-note">曲線是時間紀錄；實際軌道仍是圓。<br>等速圓周近似，右端起算；向量依各自最大值縮放。</p></section>
</div><script>(()=>{const root=document.getElementById('shm-visual'),$=id=>root.querySelector('#'+id),slider=$('s-time'),play=$('s-play');let p=0,mode=['pos','vel','acc'].includes(location.hash.slice(1))?location.hash.slice(1):'pos',running=false,last=0,frame=0;const cfg={pos:['位置 x →','x＝R cos(ωt)','位置 r','位移 x','R'],vel:['速度 vₓ →','vₓ＝−Rω sin(ωt)','速度 v','速度 vₓ','Rω'],acc:['加速度 aₓ →','aₓ＝−Rω² cos(ωt)','加速度 a','加速度 aₓ','Rω²']};function val(q){let t=2*Math.PI*q;return mode==='pos'?Math.cos(t):mode==='vel'?-Math.sin(t):-Math.cos(t)}function attr(id,k,v){$(id).setAttribute(k,v)}function draw(){let t=p*2*Math.PI,c=Math.cos(t),s=Math.sin(t),x=260+140*c,y=200-140*s,tx=mode==='pos'?260:x,ty=mode==='pos'?200:y,dx=mode==='pos'?140*c:mode==='vel'?-90*s:-90*c,dy=mode==='pos'?-140*s:mode==='vel'?-90*c:90*s;attr('s-radius','x2',x);attr('s-radius','y2',y);attr('s-moon','cx',x);attr('s-moon','cy',y);for(const [k,v]of Object.entries({x1:tx,y1:ty,x2:tx+dx,y2:ty+dy}))attr('s-vector',k,v);attr('s-drop','x1',x);attr('s-drop','x2',x);attr('s-drop','y1',y);attr('s-drop','y2',413);attr('s-shadow','cx',x);let len=Math.hypot(dx,dy);attr('s-vector-label','x',Math.max(50,Math.min(470,tx+dx/2+22*dy/len)));attr('s-vector-label','y',Math.max(48,Math.min(370,ty+dy/2-22*dx/len)));$('s-vector-label').textContent=cfg[mode][2];let sx=mode==='pos'?260:x,ex=mode==='pos'?x:x+dx;attr('s-proj','x1',sx);attr('s-proj','x2',ex);attr('s-proj','visibility',Math.abs(ex-sx)<2?'hidden':'visible');attr('s-proj-label','x',(sx+ex)/2);$('s-proj-label').textContent=cfg[mode][3]+(Math.abs(ex-sx)<2?'＝0':'');let d='',steps=Math.max(1,Math.ceil(p*220));for(let i=0;i<=steps;i++){let q=p*i/steps;d+=(i?' L ':'M ')+(250+120*val(q)).toFixed(2)+' '+(80+360*q).toFixed(2)}attr('s-curve','d',d);let gx=250+120*val(p),gy=80+360*p;attr('s-plot','cx',gx);attr('s-plot','cy',gy);attr('s-now','y1',gy);attr('s-now','y2',gy);let samples='';for(let q=0;q<=p+1e-8;q+=.125)samples+='<circle cx="'+(250+120*val(q))+'" cy="'+(80+360*q)+'" r="3" fill="var(--viz-series-2)"/>';$('s-samples').innerHTML=samples;$('s-axis').textContent=cfg[mode][0];$('s-neg').textContent='−'+cfg[mode][4];$('s-plus').textContent='+'+cfg[mode][4];$('s-formula').textContent=cfg[mode][1];root.dataset.mode=mode;$('s-readout').textContent=cfg[mode][0].replace(' →','')+'/'+cfg[mode][4]+'＝'+(Math.abs(val(p))<1e-9?0:val(p)).toFixed(2);slider.value=Math.round(p*1000);$('s-value').textContent=p.toFixed(2)+' T';for(const k of ['pos','vel','acc'])$('s-'+k).setAttribute('aria-pressed',String(k===mode))}function tick(now){if(!running)return;if(last)p=Math.min(1,p+(now-last)/18000);last=now;draw();if(p>=1){running=false;play.textContent='再播放';return}frame=requestAnimationFrame(tick)}play.onclick=()=>{if(running){running=false;cancelAnimationFrame(frame);play.textContent='繼續';return}if(p>=1)p=0;running=true;last=0;play.textContent='暫停';frame=requestAnimationFrame(tick)};slider.oninput=()=>{running=false;cancelAnimationFrame(frame);play.textContent='繼續';p=+slider.value/1000;draw()};$('s-reset').onclick=()=>{running=false;cancelAnimationFrame(frame);p=0;play.textContent='播放一週期';draw()};for(const k of ['pos','vel','acc'])$('s-'+k).onclick=()=>{mode=k;history.replaceState(null,'','#'+k);draw()};draw()})();</script><footer>圖片：Benjamin Crowell／<a href="https://phys.libretexts.org/Bookshelves/Relativity/Special_Relativity_(Crowell)/01%3A_Spacetime/1.01%3A_Three_Models_of_Spacetime" target="_blank" rel="noopener">Physics LibreTexts</a> · <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>（時序重排；望遠鏡視角模擬）</footer></main></body></html>
